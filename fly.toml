# Fly.io-Konfiguration. App-Name ist weltweit eindeutig - bei Bedarf beim ersten Deploy anpassen.
app = "fmm-live-moderator"
primary_region = "fra"   # Frankfurt (EU)

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  AI_DAILY_BUDGET_USD = "5"
  RETENTION_DAYS = "30"

[mounts]
  source = "moderator_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Der Bot muss dauerhaft laufen, um LIVE-Starts zu erkennen -> nie automatisch schlafen legen.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"

[[restart]]
  policy = "always"
  retries = 10
